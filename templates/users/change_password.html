{% extends 'base.html' %}

{% block title %}Ganti Password - {{ branding.app_name }}{% endblock %}
{% block header_title %}Pengaturan Keamanan / Ganti Password{% endblock %}

{% block content %}
<div class="form-card form-narrow-500">
    <h3 class="text-accent mb-15">🔑 Ganti Password Mandiri</h3>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label>Password Saat Ini *</label>
            <input type="password" name="old_password" class="form-control" required placeholder="Masukkan password lama Anda...">
        </div>
        <div class="form-group">
            <label>Password Baru *</label>
            <input type="password" name="new_password" class="form-control" required placeholder="Masukkan password baru...">
        </div>
        <div class="form-group">
            <label>Konfirmasi Password Baru *</label>
            <input type="password" name="confirm_password" class="form-control" required placeholder="Ulangi password baru...">
        </div>
        <button type="submit" class="btn-primary w-full">Perbarui Password</button>
    </form>
</div>
{% endblock %}
