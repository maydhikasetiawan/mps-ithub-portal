<div id="confirm-modal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; max-width: 400px; width: 90%; box-sizing: border-box;">
        <p id="confirm-modal-message" style="color: #f8fafc; font-size: 14px; margin: 0 0 20px 0; line-height: 1.5;"></p>
        <div style="display: flex; justify-content: flex-end; gap: 10px; align-items: center;">
            <button type="button" id="confirm-modal-cancel" style="background: #334155; color: #cbd5e1; padding: 10px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;">Batal</button>
            <button type="button" id="confirm-modal-confirm" class="btn-danger" style="border: none; cursor: pointer; font-weight: bold; font-size: 14px; min-height: 44px; padding: 10px 16px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;">Ya, Hapus</button>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('confirm-modal');
    var messageEl = document.getElementById('confirm-modal-message');
    var cancelBtn = document.getElementById('confirm-modal-cancel');
    var confirmBtn = document.getElementById('confirm-modal-confirm');
    var forms = document.querySelectorAll('form[data-confirm]');

    if (!modal || forms.length === 0) {
        return;
    }

    var pendingForm = null;

    function closeModal() {
        modal.style.display = 'none';
        pendingForm = null;
    }

    forms.forEach(function(form) {
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            pendingForm = form;
            messageEl.textContent = form.getAttribute('data-confirm') || '';
            if (confirmBtn) {
                confirmBtn.textContent = form.getAttribute('data-confirm-label') || 'Ya, Hapus';
            }
            modal.style.display = 'flex';
        });
    });

    if (confirmBtn) {
        confirmBtn.addEventListener('click', function() {
            if (pendingForm) {
                var formToSubmit = pendingForm;
                closeModal();
                formToSubmit.submit();
            }
        });
    }

    if (cancelBtn) {
        cancelBtn.addEventListener('click', closeModal);
    }

    modal.addEventListener('click', function(event) {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && modal.style.display === 'flex') {
            closeModal();
        }
    });
});
</script>
