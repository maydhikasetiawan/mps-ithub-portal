<div id="confirm-modal" class="confirm-modal">
    <div class="confirm-modal-card">
        <p id="confirm-modal-message" class="confirm-modal-message"></p>
        <div class="confirm-modal-actions">
            <button type="button" id="confirm-modal-cancel" class="btn-secondary">Batal</button>
            <button type="button" id="confirm-modal-confirm" class="btn-danger">Ya, Hapus</button>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('confirm-modal');
    var messageEl = document.getElementById('confirm-modal-message');
    var cancelBtn = document.getElementById('confirm-modal-cancel');
    var confirmBtn = document.getElementById('confirm-modal-confirm');
    var forms = document.querySelectorAll('form[data-confirm]');

    if (!modal || forms.length === 0) {
        return;
    }

    var pendingForm = null;

    function closeModal() {
        modal.style.display = 'none';
        pendingForm = null;
    }

    forms.forEach(function(form) {
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            pendingForm = form;
            messageEl.textContent = form.getAttribute('data-confirm') || '';
            if (confirmBtn) {
                confirmBtn.textContent = form.getAttribute('data-confirm-label') || 'Ya, Hapus';
            }
            modal.style.display = 'flex';
        });
    });

    if (confirmBtn) {
        confirmBtn.addEventListener('click', function() {
            if (pendingForm) {
                var formToSubmit = pendingForm;
                closeModal();
                formToSubmit.submit();
            }
        });
    }

    if (cancelBtn) {
        cancelBtn.addEventListener('click', closeModal);
    }

    modal.addEventListener('click', function(event) {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && modal.style.display === 'flex') {
            closeModal();
        }
    });
});
</script>
