{% extends 'base.html' %}
{% block title %}Edit Template Respon - {{ branding.app_name }}{% endblock %}
{% block header_title %}Edit Template Respon (Admin & IT){% endblock %}
{% block content %}
<div class="mb-20">
    <a href="{{ url_for('tickets.manage_canned_responses') }}" class="back-link">← Kembali ke Kelola Template Respon</a>
</div>

<div class="form-card">
    <h4 class="text-accent mb-15">Edit Template Respon</h4>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group mb-15">
            <label class="form-label-sm">Judul Template *</label>
            <input type="text" name="title" class="form-control" required maxlength="255" value="{{ template_item.title }}">
        </div>
        <div class="form-group mb-15">
            <label class="form-label-sm">Kategori</label>
            <select name="category" class="form-control">
                <option value="" {% if template_item.category == 'Umum' %}selected{% endif %}>Umum (Default)</option>
                {% for c in categories %}
                <option value="{{ c.name }}" {% if template_item.category == c.name %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group mb-15">
            <label class="form-label-sm">Konten Template *</label>
            <textarea name="content" class="form-control" rows="6" required placeholder="Tuliskan isi template respon di sini...">{{ template_item.content }}</textarea>
        </div>
        <div class="flex gap-10 items-center">
            <button type="submit" class="btn-primary">Simpan Perubahan</button>
            <a href="{{ url_for('tickets.manage_canned_responses') }}" class="back-link">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
