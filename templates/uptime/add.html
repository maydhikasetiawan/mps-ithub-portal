{% extends 'base.html' %}

{% block title %}Tambah Monitor - MPS-ITHub{% endblock %}
{% block header_title %}Tambah Target Monitor Baru{% endblock %}

{% block content %}
<div class="form-card form-narrow">
    <h3 class="text-accent mb-15">🌐 Informasi Target Health Check</h3>
    <form method="POST">
        <div class="form-group">
            <label>Nama Layanan / Host *</label>
            <input type="text" name="name" class="form-control" required placeholder="Contoh: Server Core Router / Web Portal">
        </div>
        <div class="form-group">
            <label>Target IP Address / Domain *</label>
            <input type="text" name="target" class="form-control" required placeholder="Contoh: 192.168.1.1 atau mpshub.my.id">
        </div>
        <div class="form-group">
            <label>Metode Pengecekan *</label>
            <select name="type" class="form-control">
                <option value="TCP">TCP Port Check (Ping/Port)</option>
                <option value="HTTP">HTTP/HTTPS Endpoint</option>
            </select>
        </div>
        <div class="form-group">
            <label>Port (Opsional, khusus TCP)</label>
            <input type="number" name="port" class="form-control" placeholder="Contoh: 80, 443, 22, 8080 (Default: 80)">
        </div>
        <button type="submit" class="btn-primary w-full">+ Simpan & Cek Koneksi</button>
    </form>
</div>
{% endblock %}
