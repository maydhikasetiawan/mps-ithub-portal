{% extends 'base.html' %}

{% block title %}Edit Monitor - MPS-ITHub{% endblock %}
{% block header_title %}Edit Target Monitor{% endblock %}

{% block content %}
<div class="form-card form-narrow">
    <h3 class="text-accent mb-15">🌐 Informasi Target Health Check</h3>
    <form method="POST">
        <div class="form-group">
            <label>Nama Layanan / Host *</label>
            <input type="text" name="name" class="form-control" required value="{{ monitor.name }}" placeholder="Contoh: Server Core Router / Web Portal">
        </div>
        <div class="form-group">
            <label>Target IP Address / Domain *</label>
            <input type="text" name="target" class="form-control" required value="{{ monitor.target }}" placeholder="Contoh: 192.168.1.1 atau mpshub.my.id">
        </div>
        <div class="form-group">
            <label>Metode Pengecekan *</label>
            <select name="type" class="form-control">
                <option value="TCP" {% if monitor.type == 'TCP' %}selected{% endif %}>TCP Port Check (Ping/Port)</option>
                <option value="HTTP" {% if monitor.type == 'HTTP' %}selected{% endif %}>HTTP/HTTPS Endpoint</option>
            </select>
        </div>
        <div class="form-group">
            <label>Port (Opsional, khusus TCP)</label>
            <input type="number" name="port" class="form-control" value="{{ monitor.port or '' }}" placeholder="Contoh: 80, 443, 22, 8080 (Default: 80)">
        </div>
        <div class="form-group mb-20">
            <label class="flex items-center gap-8 cursor-pointer">
                <input type="checkbox" name="enabled" {% if monitor.enabled %}checked{% endif %}>
                Aktifkan monitoring otomatis (scheduler tiap 5 menit)
            </label>
        </div>
        <button type="submit" class="btn-primary w-full">💾 Simpan Perubahan</button>
    </form>
    <div class="mt-15 text-center">
        <a href="{{ url_for('uptime.index') }}" class="back-link text-14">Batal</a>
    </div>
</div>
{% endblock %}
