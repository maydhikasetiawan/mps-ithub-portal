{% extends 'base.html' %}

{% block title %}Edit Aset - {{ branding.app_name }}{% endblock %}
{% block header_title %}Edit Detail Aset{% endblock %}

{% block content %}
<div class="form-card">
    <form method="POST">
        <!-- Field Read-Only (Tidak Dapat Diubah) -->
        <div class="form-group">
            <label>Asset Tag (Locked)</label>
            <input type="text" class="form-control opacity-60 cursor-not-allowed" value="{{ asset.asset_tag }}" disabled>
        </div>
        <div class="form-group">
            <label>Nama Perangkat / Server (Locked)</label>
            <input type="text" class="form-control opacity-60 cursor-not-allowed" value="{{ asset.name }}" disabled>
        </div>
        <div class="form-group">
            <label>Kategori (Locked)</label>
            <input type="text" class="form-control opacity-60 cursor-not-allowed" value="{{ asset.category }}" disabled>
        </div>

        <hr class="form-divider">

        <!-- Field yang Boleh Di-edit -->
        <div class="form-group">
            <label>IP Address (IPAM)</label>
            <input type="text" name="ip_address" class="form-control" value="{{ asset.ip_address or '' }}">
        </div>
        <div class="form-group">
            <label>MAC Address</label>
            <input type="text" name="mac_address" class="form-control" value="{{ asset.mac_address or '' }}">
        </div>
        <div class="form-group">
            <label>Serial Number</label>
            <input type="text" name="serial_number" class="form-control" maxlength="100" value="{{ asset.serial_number or '' }}">
        </div>
        <div class="form-group">
            <label>Status Perangkat</label>
            <select name="status" class="form-control">
                <option value="Procurement" {% if asset.status == 'Procurement' %}selected{% endif %}>Procurement</option>
                <option value="Active" {% if asset.status == 'Active' %}selected{% endif %}>Active</option>
                <option value="Under Repair" {% if asset.status == 'Under Repair' %}selected{% endif %}>Under Repair</option>
                <option value="Retired" {% if asset.status == 'Retired' %}selected{% endif %}>Retired</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ditugaskan Kepada</label>
            <select name="assigned_to" class="form-control">
                <option value="" {% if not asset.assigned_to %}selected{% endif %}>Unassigned</option>
                {% for u in users %}
                <option value="{{ u }}" {% if asset.assigned_to == u %}selected{% endif %}>{{ u }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Tanggal Beli</label>
            <input type="date" name="purchase_date" class="form-control" value="{{ asset.purchase_date.strftime('%Y-%m-%d') if asset.purchase_date else '' }}">
        </div>
        <div class="form-group">
            <label>Garansi Habis</label>
            <input type="date" name="warranty_expiry" id="warranty_expiry" class="form-control" value="{{ asset.warranty_expiry.strftime('%Y-%m-%d') if asset.warranty_expiry else '' }}" {% if asset.no_warranty %}disabled{% endif %}>
        </div>
        <div class="form-group">
            <label><input type="checkbox" name="no_warranty" value="1" id="no_warranty" {% if asset.no_warranty %}checked{% endif %}> Tanpa Garansi</label>
        </div>
        <div class="form-group">
            <label>Lokasi Perangkat / Region</label>
            <input type="text" name="location" class="form-control" value="{{ asset.location or '' }}">
        </div>
        <div class="form-group">
            <label>Catatan Tambahan</label>
            <textarea name="notes" class="form-control" rows="3">{{ asset.notes or '' }}</textarea>
        </div>

        <button type="submit" class="btn-primary">Update Aset</button>
        <a href="{{ url_for('assets.index') }}" class="back-link ml-15">Batal</a>
    </form>
</div>
<script>
(function() {
    var chk = document.getElementById('no_warranty');
    var exp = document.getElementById('warranty_expiry');
    if (!chk || !exp) return;
    chk.addEventListener('change', function() {
        if (chk.checked) {
            exp.value = '';
            exp.disabled = true;
        } else {
            exp.disabled = false;
        }
    });
})();
</script>
{% endblock %}
