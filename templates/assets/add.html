{% extends 'base.html' %}

{% block title %}Tambah Aset - MPS-ITHub{% endblock %}
{% block header_title %}Tambah Aset Baru{% endblock %}

{% block content %}
<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Asset Tag / Nomor Seri *</label>
            <input type="text" name="asset_tag" class="form-control" required placeholder="Contoh: AST-SRV-001">
        </div>
        <div class="form-group">
            <label>Nama Perangkat / Server *</label>
            <input type="text" name="name" class="form-control" required placeholder="Contoh: AWS EC2 Web Server">
        </div>
        <div class="form-group">
            <label>Kategori *</label>
            <select name="category" class="form-control">
                <option value="Server">Server VPS / Physical</option>
                <option value="PC/Laptop">PC / Laptop</option>
                <option value="Network">Router / Switch / AP</option>
                <option value="Docker Container">Docker Container</option>
                <option value="Printer/Peripherals">Printer / Peripheral</option>
            </select>
        </div>
        <div class="form-group">
            <label>IP Address (IPAM)</label>
            <input type="text" name="ip_address" class="form-control" placeholder="Contoh: 172.31.33.237">
        </div>
        <div class="form-group">
            <label>MAC Address</label>
            <input type="text" name="mac_address" class="form-control" placeholder="Contoh: 00:1B:44:11:3A:B7">
        </div>
        <div class="form-group">
            <label>Status Perangkat</label>
            <select name="status" class="form-control">
                <option value="Procurement">Procurement</option>
                <option value="Active">Active</option>
                <option value="Under Repair">Under Repair</option>
                <option value="Retired">Retired</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ditugaskan Kepada</label>
            <select name="assigned_to" class="form-control">
                <option value="">Unassigned</option>
                {% for u in users %}
                <option value="{{ u }}">{{ u }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Lokasi Perangkat / Region</label>
            <input type="text" name="location" class="form-control" placeholder="Contoh: AWS ap-southeast-3 / Rak Server 1">
        </div>
        <div class="form-group">
            <label>Catatan Tambahan</label>
            <textarea name="notes" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-primary">Simpan Aset</button>
        <a href="{{ url_for('assets.index') }}" style="color: #94a3b8; margin-left: 15px; font-size: 13px; text-decoration: none;">Batal</a>
    </form>
</div>
{% endblock %}
